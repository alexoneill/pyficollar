[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyficollar"
dynamic = ["version"]
description = "Python client library and CLI for the TryFi (Fi smart dog collar) API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alex O'Neill", email = "me@aoneill.me" }
]
keywords = ["tryfi", "fi", "collar", "dog", "gps", "pet-tracker", "iot", "pyficollar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
test = ["pytest"]

[project.scripts]
pyficollar = "pyficollar.cli:main"
tryfi = "pyficollar.cli:main"

[project.urls]
Homepage = "https://github.com/alexoneill/pyficollar"
Repository = "https://github.com/alexoneill/pyficollar"
Issues = "https://github.com/alexoneill/pyficollar/issues"

[tool.setuptools_scm]
version_file = "pyficollar/_version.py"

[tool.setuptools.package-data]
pyficollar = ["py.typed"]

[tool.setuptools.packages.find]
include = ["pyficollar*"]
